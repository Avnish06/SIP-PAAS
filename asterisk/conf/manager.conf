; Asterisk Manager Interface (AMI) — for API integration
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no

[amiuser]
secret = AmiPassword!
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.255
permit=172.16.0.0/255.240.0.0
permit=192.168.0.0/255.255.0.0
permit=10.0.0.0/255.0.0.0
read = all
write = all
writetimeout = 5000
