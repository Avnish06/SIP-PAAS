; ─────────────────────────────────────────────────────────────
;  Asterisk PJSIP Configuration — SIP-as-a-Service
;
;  Listens on 5080 (Kamailio sends here on 5060→5080)
;  Upstream: Synchrovox (IP-based, port 5060)
;           Vocallabs / Subspace (registration-based, port 3300)
; ─────────────────────────────────────────────────────────────

; ── Global transport ─────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080
external_media_address=152.58.97.143
external_signaling_address=152.58.97.143
local_net=192.168.0.0/16
local_net=172.16.0.0/12
local_net=10.0.0.0/8

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5080
external_media_address=152.58.97.143
external_signaling_address=152.58.97.143
local_net=192.168.0.0/16
local_net=172.16.0.0/12
local_net=10.0.0.0/8

; ── WebSocket transport for WebRTC browser clients ───────────
; Do NOT set external_media_address here — WebRTC uses ICE for NAT
; traversal. Setting external_media_address overrides ICE and breaks
; local connections (browser on same host as Asterisk).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; ─────────────────────────────────────────────────────────────
;  KAMAILIO trunk — Asterisk accepts all calls from Kamailio
;  Kamailio is on 127.0.0.1, no auth (same host)
; ─────────────────────────────────────────────────────────────
[kamailio-aor]
type=aor
; Asterisk is now on bridge network. Kamailio (host-networked) is at the
; Docker bridge gateway — 172.18.0.1 from inside bridge containers.
contact=sip:172.18.0.1:5060

[kamailio-identify]
type=identify
endpoint=kamailio
; Kamailio uses host networking — it reaches Asterisk via 127.0.0.1:5080.
; Browser WebSocket traffic ALSO appears to come from 172.18.0.1 (the same
; Docker bridge gateway), so we cannot match the bridge IP here — doing so
; misidentifies the browser as Kamailio and breaks WebRTC REGISTER (404).
; The dispatcher OPTIONS NOTICE noise from 172.18.0.1:5060 is harmless.
match=127.0.0.1

[kamailio]
type=endpoint
context=from-kamailio
transport=transport-udp
aors=kamailio-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow=!all,ulaw,alaw,g722
from_domain=152.58.97.143

; ─────────────────────────────────────────────────────────────
;  Synchrovox — IP-based upstream trunk (no registration)
;
;  IP      : 20.193.182.13
;  Port    : 5060
;  User    : synchrovoxai_new.com
;  CLI     : 00919240292847
;  Prefix  : 0  (prepended to DNIS on send)
; ─────────────────────────────────────────────────────────────
[synchrovox-auth]
type=auth
auth_type=userpass
username=synchrovoxai_new.com
password=1kdu9sr0a3w

[synchrovox-aor]
type=aor
contact=sip:20.193.182.13:5060
max_contacts=1
; qualify_frequency=0 disables the periodic OPTIONS probe. The trunk's RTT
; (~170 ms) plus public-internet jitter was causing the 3 s probe to miss
; occasionally, flipping the AOR to "Unreachable". Any Dial() that landed
; in that gap failed instantly with "invalid URI 'synchrovox-aor'", and the
; user only got through on the next retry ~30-60 s later — which is the
; "44 seconds to connect" we were seeing. The registration's own refresh
; keeps the NAT pinhole open; reachability is verified by the INVITE.
qualify_frequency=0

[synchrovox-registration]
type=registration
transport=transport-udp
outbound_auth=synchrovox-auth
server_uri=sip:20.193.182.13:5060
client_uri=sip:synchrovoxai_new.com@20.193.182.13:5060
expiration=120
retry_interval=60
contact_user=synchrovoxai_new.com

[synchrovox-identify]
type=identify
endpoint=synchrovox-trunk
match=20.193.182.13

[synchrovox-trunk]
type=endpoint
context=from-synchrovox
transport=transport-udp
aors=synchrovox-aor
outbound_auth=synchrovox-auth
; direct_media=yes lets Asterisk negotiate a native_rtp bridge when BOTH
; endpoints in a bridge support it. For click-to-call (two synchrovox-trunk
; legs bridged together) this tells each leg to send media directly to the
; other — both legs terminate on the same Synchrovox SBC, so audio loops
; inside Synchrovox and never traverses the residential NAT.
;
; Safe for browser calls: the WebRTC endpoint has direct_media=no, so the
; bridge falls back to simple_bridge (Asterisk in media path) automatically.
direct_media=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; rtp_keepalive: send silence RTP every N seconds regardless of audio source.
; Critical on residential NAT: opens the NAT pinhole from Asterisk's side so
; Synchrovox's RTP replies can route back. Without this, a bridge between two
; Asterisk-originated legs has nothing to forward in either direction and we
; see Receive=0/Transmit=0 on pjsip channelstats.
rtp_keepalive=5
; rtp_timeout: drop the call if no RTP is received for this many seconds.
; Helps avoid zombie silent calls.
rtp_timeout=60
allow=!all,ulaw,alaw,g722
from_user=00919240292847
from_domain=20.193.182.13
outbound_proxy=sip:20.193.182.13:5060

; ─────────────────────────────────────────────────────────────
;  WebRTC browser endpoint — portal in-browser phone
;  Connects via ws://152.58.97.143:8088/ws
;  Username: webrtcuser  Password: WebRTC2024!
; ─────────────────────────────────────────────────────────────
[webrtc-auth]
type=auth
auth_type=userpass
username=webrtcuser
password=WebRTC2024!

; AOR name MUST match the SIP username (webrtcuser) for REGISTER to work
[webrtcuser]
type=aor
max_contacts=5
remove_existing=yes

; Endpoint name MUST match SIP username so identify_by=username works
[webrtcuser]
type=endpoint
context=from-webrtc
transport=transport-ws
auth=webrtc-auth
aors=webrtcuser
dtls_auto_generate_cert=yes
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
; Codec preference order is alaw FIRST. Synchrovox always answers with alaw
; in its 200 OK (carrier preference), and if the browser leg negotiates
; ulaw we end up transcoding alaw→ulaw and lose ~20k frames per call —
; that's the choppy / broken audio. Putting alaw first here makes both
; legs negotiate alaw natively, so audio passes through with zero
; transcoding. Browsers (JsSIP/SIP.js) support PCMA fine.
allow=!all,alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
