; ─────────────────────────────────────────────────────────────
;  Asterisk PJSIP Configuration — SIP-as-a-Service
;
;  Listens on 5080 (Kamailio sends here on 5060→5080)
;  Connects upstream to: TATA (IP-based) + Provider2 (reg-based)
; ─────────────────────────────────────────────────────────────

; ── Global transport ─────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5080

; ─────────────────────────────────────────────────────────────
;  KAMAILIO trunk — Asterisk accepts all calls from Kamailio
;  Kamailio is on 127.0.0.1, no auth (same host)
; ─────────────────────────────────────────────────────────────
[kamailio-aor]
type=aor
contact=sip:127.0.0.1:5060

[kamailio-identify]
type=identify
endpoint=kamailio
match=127.0.0.1

[kamailio]
type=endpoint
context=from-kamailio
transport=transport-udp
aors=kamailio-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow=!all,ulaw,alaw,g722
from_domain=sip.yourdomain.com
; Pass through X-Customer-ID and X-Trunk-ID headers
pass_rtp_stats=yes

; ─────────────────────────────────────────────────────────────
;  TATA Tele — IP-based upstream trunk
;  No registration needed. We send to TATA_IP:TATA_PORT.
;  TATA whitelists our PUBLIC_IP.
; ─────────────────────────────────────────────────────────────
[tata-trunk-aor]
type=aor
contact=sip:203.x.x.x:5060

[tata-trunk-identify]
type=identify
endpoint=tata-trunk
match=203.x.x.x

[tata-trunk-auth]
type=auth
auth_type=userpass
username=
password=

[tata-trunk]
type=endpoint
context=from-tata
transport=transport-udp
aors=tata-trunk-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow=!all,ulaw,alaw
from_user=+911234567890
from_domain=203.x.x.x
outbound_proxy=sip:203.x.x.x:5060

; ─────────────────────────────────────────────────────────────
;  Provider2 — Registration-based upstream trunk
;  Asterisk registers to provider2 SIP server.
;  NOTE: Kamailio UAC also handles registration — use one or
;  the other. Asterisk approach shown here for flexibility.
; ─────────────────────────────────────────────────────────────
[prov2-trunk-auth]
type=auth
auth_type=userpass
username=your_username
password=your_password

[prov2-trunk-aor]
type=aor
contact=sip:sip.provider2.com:5060
max_contacts=1
qualify_frequency=30
; Registration:
contact=sip:your_username@sip.provider2.com:5060

[prov2-trunk-registration]
type=registration
transport=transport-udp
outbound_auth=prov2-trunk-auth
server_uri=sip:sip.provider2.com:5060
client_uri=sip:your_username@sip.provider2.com:5060
expiration=120
retry_interval=60
contact_user=your_username

[prov2-trunk-identify]
type=identify
endpoint=prov2-trunk
match=sip.provider2.com

[prov2-trunk]
type=endpoint
context=from-prov2
transport=transport-udp
aors=prov2-trunk-aor
outbound_auth=prov2-trunk-auth
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
allow=!all,ulaw,alaw
from_user=your_ddi_number
from_domain=sip.provider2.com
