[general]
; Asterisk RTP range — disjoint from RTPEngine (10000-15000) to avoid
; host-port collisions. RTPEngine owns the customer leg; Asterisk owns
; the carrier leg (Synchrovox) and the WebRTC leg, both of which need
; publicly reachable ports — so this range is mapped 1:1 in docker-compose.
rtpstart=16000
rtpend=16100
strictrtp=no
probation=0
dtmftimeout=3000
stunaddr=stun.l.google.com:19302
icesupport=yes
; TURN relay — allows media to flow through NAT/Docker when direct ICE fails.
; Both the browser and Asterisk relay through this server so audio reaches both sides.
turnaddr=openrelay.metered.ca
turnport=3478
turnlogin=openrelayproject
turnpassword=openrelayproject
externaddr=152.58.97.143
localnet=172.16.0.0/12
localnet=192.168.0.0/16
localnet=10.0.0.0/8
