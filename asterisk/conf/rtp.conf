[general]
; Asterisk RTP range — disjoint from RTPEngine (10000-15000) to avoid
; host-port collisions. RTPEngine owns the customer leg; Asterisk owns
; the carrier leg (Synchrovox) and the WebRTC leg, both of which need
; publicly reachable ports — so this range is mapped 1:1 in docker-compose.
rtpstart=16000
rtpend=16100
strictrtp=no
probation=0
dtmftimeout=3000
; stunaddr disabled: DNS lookup of stun.l.google.com fails inside this
; container ("Failed to resolve stunaddr ... Cancelling recurring resolution"
; in the Asterisk log). externaddr below already gives Asterisk its public
; IP, so STUN is redundant — and the failed resolution was leaving ICE in a
; degraded state on every WebRTC call.
;stunaddr=stun.l.google.com:19302
icesupport=yes
; TURN client disabled on the Asterisk side. Asterisk has a public IP
; (externaddr below), so its host candidate is directly reachable — no
; relay allocation is needed for it. Allocating against the free
; openrelay.metered.ca server was adding 1-3 s of ICE-gathering delay
; on every outbound WebRTC call. The browser still uses its own TURN
; for the client-side leg, so NAT traversal is unaffected.
;turnaddr=openrelay.metered.ca
;turnport=3478
;turnlogin=openrelayproject
;turnpassword=openrelayproject
externaddr=152.58.97.143
localnet=172.16.0.0/12
localnet=192.168.0.0/16
localnet=10.0.0.0/8
