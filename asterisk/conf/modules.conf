; Asterisk modules.conf — let Asterisk resolve dependency order automatically
[modules]
autoload = yes

; ── Disable hardware/console channels not available in Docker ──
noload = chan_alsa.so
noload = chan_console.so
noload = chan_oss.so
noload = chan_mgcp.so
noload = chan_skinny.so
noload = chan_unistim.so
noload = chan_dahdi.so

; ── Disable external deps not installed ───────────────────────
noload = res_config_ldap.so
noload = res_config_pgsql.so
noload = res_snmp.so
noload = res_xmpp.so
noload = res_fax.so
noload = res_fax_spandsp.so
noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = cdr_radius.so
noload = cel_radius.so
noload = res_radius.so

; ── CDR: use CSV (builtin) — not MySQL native ─────────────────
; cdr_mysql.so is not in Ubuntu 22.04 asterisk package
noload = cdr_mysql.so
noload = res_cdr_mysql.so
