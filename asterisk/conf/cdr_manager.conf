; ─────────────────────────────────────────────────────────────
;  CDR via AMI — required for the billing service to receive
;  Cdr events on the AMI socket. Without enabled=yes, Asterisk
;  generates CDRs internally but does NOT publish them on AMI,
;  so the billing-engine's AMI listener never sees them and the
;  cdr table stays empty.
; ─────────────────────────────────────────────────────────────

[general]
enabled = yes
