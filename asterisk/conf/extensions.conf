; ─────────────────────────────────────────────────────────────
;  Asterisk Dialplan — SIP-as-a-Service
;
;  Contexts:
;   from-kamailio  → calls from customers (outbound to PSTN)
;   from-tata      → inbound calls from TATA
;   from-prov2     → inbound calls from Provider2
;   outbound       → routing logic to upstream
; ─────────────────────────────────────────────────────────────

[globals]
TATA_TRUNK=PJSIP/tata-trunk
PROV2_TRUNK=PJSIP/prov2-trunk

; ─────────────────────────────────────────────────────────────
;  from-kamailio: customer outbound calls
;  X-Customer-ID and X-Trunk-ID are in SIP headers
; ─────────────────────────────────────────────────────────────
[from-kamailio]

; Extract customer metadata from SIP headers
exten => _.,1,NoOp(Customer call: ${CALLERID(num)} → ${EXTEN})
 same => n,Set(CUSTOMER_ID=${PJSIP_HEADER(read,X-Customer-ID)})
 same => n,Set(TRUNK_ID=${PJSIP_HEADER(read,X-Trunk-ID)})
 same => n,NoOp(Customer: ${CUSTOMER_ID} Trunk: ${TRUNK_ID})

 ; Set CDR fields
 same => n,Set(CDR(customer_id)=${CUSTOMER_ID})
 same => n,Set(CDR(trunk_id)=${TRUNK_ID})
 same => n,Set(CDR(src_user)=${CALLERID(num)})

 ; Normalize destination to E.164 (prepend +91 if 10 digits for India)
 same => n,GotoIf($[${LEN(${EXTEN})} == 10]?normalize)
 same => n,GotoIf($[${LEN(${EXTEN})} == 11 & ${EXTEN:0:1} == 0]?normalize_0)
 same => n,Set(DEST=${EXTEN})
 same => n,Goto(route)

 same => n(normalize),Set(DEST=+91${EXTEN})
 same => n,Goto(route)

 same => n(normalize_0),Set(DEST=+91${EXTEN:1})
 same => n,Goto(route)

 same => n(route),Goto(outbound,${DEST},1)

; ─────────────────────────────────────────────────────────────
;  outbound: route to upstream provider
;  Primary: TATA | Failover: Provider2
; ─────────────────────────────────────────────────────────────
[outbound]

; ── Indian numbers (E.164 +91XXXXXXXXXX) → TATA primary ─────
exten => _+91.,1,NoOp(Outbound India: ${EXTEN})
 same => n,Set(CALLERID(num)=${+911234567890})
 same => n,Dial(${TATA_TRUNK}/${EXTEN},,tTo)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 ; TATA failed — try Provider2
 same => n,Dial(${PROV2_TRUNK}/${EXTEN},,tTo)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Hangup(16)
 same => n(busy),Hangup(17)
 same => n(noanswer),Hangup(19)

; ── International numbers ─────────────────────────────────────
exten => _+.,1,NoOp(Outbound International: ${EXTEN})
 same => n,Dial(${PROV2_TRUNK}/${EXTEN},,tTo)
 same => n,Hangup()

; ── Fallback ──────────────────────────────────────────────────
exten => i,1,Hangup(21)
exten => h,1,NoOp(Hangup)

; ─────────────────────────────────────────────────────────────
;  from-tata: inbound from TATA → route back to Kamailio
;  Kamailio will look up the DID and forward to customer
; ─────────────────────────────────────────────────────────────
[from-tata]

exten => _.,1,NoOp(Inbound from TATA: ${EXTEN})
 same => n,Set(CDR(src_user)=${CALLERID(num)})
 same => n,Set(CDR(dst_user)=${EXTEN})
 ; Route back to Kamailio for DID lookup & customer delivery
 same => n,Dial(PJSIP/${EXTEN}@kamailio,,tTo)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────
;  from-prov2: inbound from Provider2 → route to Kamailio
; ─────────────────────────────────────────────────────────────
[from-prov2]

exten => _.,1,NoOp(Inbound from Provider2: ${EXTEN})
 same => n,Set(CDR(src_user)=${CALLERID(num)})
 same => n,Set(CDR(dst_user)=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@kamailio,,tTo)
 same => n,Hangup()
