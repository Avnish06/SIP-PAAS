; ─────────────────────────────────────────────────────────────
;  Asterisk Dialplan — SIP-as-a-Service
;
;  Contexts:
;   from-kamailio   → customer outbound calls to PSTN
;   from-synchrovox → inbound calls from Synchrovox
;   outbound        → upstream routing logic
; ─────────────────────────────────────────────────────────────

[globals]
; ── Synchrovox (sole upstream carrier) ───────────────────────
SYNCHROVOX_TRUNK=PJSIP/synchrovox-trunk
SYNCHROVOX_PREFIX=0
SYNCHROVOX_CLI=00919240292847

; ─────────────────────────────────────────────────────────────
;  from-kamailio: customer outbound calls
;  X-Customer-ID and X-Trunk-ID are in SIP headers from Kamailio
; ─────────────────────────────────────────────────────────────
[from-kamailio]

exten => _.,1,NoOp(Customer call: ${CALLERID(num)} → ${EXTEN})
 same => n,Set(CUSTOMER_ID=${PJSIP_HEADER(read,X-Customer-ID)})
 same => n,Set(TRUNK_ID=${PJSIP_HEADER(read,X-Trunk-ID)})
 same => n,NoOp(Customer: ${CUSTOMER_ID} Trunk: ${TRUNK_ID})

 ; Set CDR fields
 same => n,Set(CDR(accountcode)=${CUSTOMER_ID})
 same => n,Set(CDR(userfield)=${TRUNK_ID})
 same => n,Set(CHANNEL(accountcode)=${CUSTOMER_ID})

 ; Normalize destination to E.164
 ; 10 digits → +91XXXXXXXXXX (India)
 same => n,GotoIf($[${LEN(${EXTEN})} == 10]?normalize)
 ; 11 digits starting with 0 → strip 0, prepend +91
 same => n,GotoIf($[${LEN(${EXTEN})} == 11 & ${EXTEN:0:1} == 0]?normalize_0)
 same => n,Set(DEST=${EXTEN})
 same => n,Goto(route)

 same => n(normalize),Set(DEST=+91${EXTEN})
 same => n,Goto(route)

 same => n(normalize_0),Set(DEST=+91${EXTEN:1})
 same => n,Goto(route)

 same => n(route),Goto(outbound,${DEST},1)

; ─────────────────────────────────────────────────────────────
;  outbound: route all calls via Synchrovox
;
;  Synchrovox expects numeric DNIS prefixed by SYNCHROVOX_PREFIX (0)
;  e.g. 09142436879 — the + is stripped, +91 reduced to 10-digit,
;  then the prefix is prepended.
;
;  Primary CLI: SYNCHROVOX_CLI (00919240292847)
; ─────────────────────────────────────────────────────────────
[outbound]

; ── Indian numbers (+91XXXXXXXXXX) via Synchrovox ────────────
;  Format: prefix(0) + 10-digit → 09142436879
;  Strip +91 (first 3 chars) to get 10-digit number, then prepend prefix
exten => _+91.,1,NoOp(Outbound India via Synchrovox: ${EXTEN})
 same => n,Set(CALLERID(num)=${SYNCHROVOX_CLI})
 same => n,Set(TEN_DIGIT=${EXTEN:3})
 same => n,Set(DNIS=${SYNCHROVOX_PREFIX}${TEN_DIGIT})
 same => n,NoOp(Sending DNIS: ${DNIS} via ${SYNCHROVOX_TRUNK})
 same => n,Dial(PJSIP/${DNIS}@synchrovox-trunk,,tTo)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?congestion)
 same => n,Hangup(16)
 same => n(busy),Hangup(17)
 same => n(noanswer),Hangup(19)
 same => n(congestion),Hangup(34)

; ── International numbers (+XXXXXXXXXXX) via Synchrovox ──────
exten => _+.,1,NoOp(Outbound International via Synchrovox: ${EXTEN})
 same => n,Set(CALLERID(num)=${SYNCHROVOX_CLI})
 same => n,Set(DNIS=${SYNCHROVOX_PREFIX}${EXTEN:1})
 same => n,Dial(PJSIP/${DNIS}@synchrovox-trunk,,tTo)
 same => n,Hangup()

; ── Fallback ──────────────────────────────────────────────────
exten => i,1,Hangup(21)
exten => h,1,NoOp(Hangup: ${HANGUPCAUSE})

; ─────────────────────────────────────────────────────────────
;  from-synchrovox: inbound calls from Synchrovox
; ─────────────────────────────────────────────────────────────
[from-synchrovox]

; Pattern is _X. (one-or-more DIGITS) — NOT _. — because the bare-dot
; wildcard also matches the special hangup extension 'h', causing the h
; handler to fall through into this flow and spuriously re-Dial the browser
; on every hangup. _X. matches numeric DIDs only and leaves h/i/t alone.
exten => _X.,1,NoOp(Inbound from Synchrovox: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(src_user)=${CALLERID(num)})
 same => n,Set(CDR(dst_user)=${EXTEN})
 same => n,Set(CDR(accountcode)=1)
 ; Send 183 Session Progress with SDP so the PSTN caller hears early
 ; media / ringback immediately instead of dead air while the browser
 ; phone rings.
 same => n,Progress()
 ; Ring the WebRTC browser phone. Dialing the endpoint name fans the
 ; INVITE out to every registered contact (max_contacts=5). 60s ring,
 ; tT allows in-call transfer by either party.
 same => n,Dial(PJSIP/webrtcuser,60,tT)
 same => n,NoOp(Inbound DIALSTATUS=${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?unavail)
 same => n,Hangup(16)
 same => n(busy),Hangup(17)
 same => n(noanswer),Hangup(19)
 ; No browser registered (nobody logged into the portal phone). Reject
 ; with 480 Temporarily Unavailable so the carrier can apply failover.
 same => n(unavail),Hangup(20)

exten => h,1,NoOp(Inbound hangup: ${HANGUPCAUSE})

; ─────────────────────────────────────────────────────────────
;  from-ari: ARI-originated outbound calls
;  The ARI endpoint already dials Synchrovox — just keep alive
; ─────────────────────────────────────────────────────────────
[from-ari]
exten => _.,1,NoOp(ARI outbound call connected: ${EXTEN})
 same => n,Answer()
 same => n,Wait(120)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────
;  click-to-call: bridgeCall() in api/src/services/asterisk.js
;  AMI-Originates a leg to the customer's mobile, which hits this
;  context with the destination dnis as ${EXTEN} and the customer's
;  id as ${CUSTOMER_ID} variable. We MUST set CDR(accountcode) here
;  in the dialplan — the AMI Account: header alone does not always
;  reach CDR records reliably.
; ─────────────────────────────────────────────────────────────
[click-to-call]
exten => _.,1,NoOp(Click-to-call: cust=${CUSTOMER_ID} dest=${EXTEN})
 same => n,Set(CDR(accountcode)=${CUSTOMER_ID})
 same => n,Set(CHANNEL(accountcode)=${CUSTOMER_ID})
 same => n,Dial(PJSIP/${EXTEN}@synchrovox-trunk,30,tTo)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────
;  from-webrtc: Browser WebRTC phone calls
;  Dials number → normalize → outbound via Synchrovox
;
;  CDR ATTRIBUTION: the portal's JsSIP client sends an X-Customer-ID
;  header on every INVITE (filled from the logged-in user's id). We
;  read it here and stamp CDR(accountcode) so the billing engine can
;  attribute the call to the correct customer. Falls back to 1 if the
;  header is missing for any reason — better than NULL.
; ─────────────────────────────────────────────────────────────
[from-webrtc]

exten => _.,1,Set(CUSTID=${PJSIP_HEADER(read,X-Customer-ID)})
 same => n,GotoIf($["${CUSTID}" = ""]?nocust)
 same => n,Set(CDR(accountcode)=${CUSTID})
 same => n,Set(CHANNEL(accountcode)=${CUSTID})
 same => n,Goto(from-webrtc-routed,${EXTEN},1)
 same => n(nocust),Set(CDR(accountcode)=1)
 same => n,Set(CHANNEL(accountcode)=1)
 same => n,Goto(from-webrtc-routed,${EXTEN},1)

[from-webrtc-routed]

; ─── Local audio test extensions (do NOT touch Synchrovox) ───
; Dial these from the browser to verify the WebRTC media path
; in isolation. If 100 plays sound, WebRTC↔Asterisk audio works
; and any "no audio" on real calls is on the Synchrovox leg.

; 100  → play a welcome clip, then echo your voice back
exten => 100,1,NoOp(WebRTC media test — Playback + Echo)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 200  → music on hold (continuous audio for 60s)
exten => 200,1,NoOp(WebRTC media test — MusicOnHold)
 same => n,Answer()
 same => n,Wait(1)
 same => n,MusicOnHold(default,60)
 same => n,Hangup()

; 300  → echo only (speak, hear yourself)
exten => 300,1,NoOp(WebRTC media test — Echo only)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; ─── Real outbound calls ────────────────────────────────────
;
; Number-format handling. Order matters — Asterisk picks the MOST SPECIFIC
; matching pattern.
;
;   _[6-9]XXXXXXXXX        Indian mobile (10 digits, starts 6/7/8/9)
;   _0XXXXXXXXXX           Indian with leading 0 (11 digits)
;   _1XXXXXXXXXX           NANP / US-Canada (11 digits starting with 1)
;   _+.                    Already E.164 with leading +
;   _XXXXXXXXXXX.          12+ digits, assumed to already include country
;                          code — we just prefix +
; ────────────────────────────────────────────────────────────

; Indian mobile — 10 digits starting with 6, 7, 8, or 9 (TRAI numbering).
; Direct dial: just prepend the Synchrovox prefix (0) — no detour through
; +91 / [outbound]. Speeds up call setup and keeps the wire-format obvious.
; To dial a US/Canada number, prefix with the country code (1 or +1).
exten => _[6-9]XXXXXXXXX,1,NoOp(WebRTC India 10-digit: ${EXTEN})
 same => n,Set(CALLERID(num)=${SYNCHROVOX_CLI})
 same => n,Set(DNIS=${SYNCHROVOX_PREFIX}${EXTEN})
 same => n,NoOp(Direct dial DNIS=${DNIS} via ${SYNCHROVOX_TRUNK})
 ; Progress() makes Asterisk send 183 Session Progress with SDP back to
 ; the browser immediately, so the caller hears trunk ringback as soon as
 ; Synchrovox sends it — instead of dead silence until the call answers.
 same => n,Progress()
 same => n,Dial(PJSIP/${DNIS}@synchrovox-trunk,30,tTo)
 same => n,Hangup()

; Indian — 11 digits already with leading 0 (e.g. 09142436879)
exten => _0XXXXXXXXXX,1,NoOp(WebRTC India trunk format: ${EXTEN})
 same => n,Set(CALLERID(num)=${SYNCHROVOX_CLI})
 same => n,Set(DNIS=${EXTEN})
 same => n,Progress()
 same => n,Dial(PJSIP/${DNIS}@synchrovox-trunk,30,tTo)
 same => n,Hangup()

; NANP / US-Canada — 11 digits starting with 1 (e.g. 16265338665)
exten => _1XXXXXXXXXX,1,NoOp(WebRTC US/CA: ${EXTEN})
 same => n,Set(DEST=+${EXTEN})
 same => n,Goto(outbound,${DEST},1)

; Already E.164 (+1, +91, +44, etc.)
exten => _+.,1,NoOp(WebRTC E.164: ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

; Generic international — 12 or more digits, no leading +.
; Assumes user typed country code already. We just prefix +.
exten => _XXXXXXXXXXX.,1,NoOp(WebRTC international (12+ digits): ${EXTEN})
 same => n,Set(DEST=+${EXTEN})
 same => n,Goto(outbound,${DEST},1)

exten => h,1,NoOp(WebRTC hangup: ${HANGUPCAUSE})
