; ─────────────────────────────────────────────────────────────
;  Asterisk Dialplan — SIP-as-a-Service
;
;  Contexts:
;   from-kamailio   → customer outbound calls to PSTN
;   from-synchrovox → inbound calls from Synchrovox
;   outbound        → upstream routing logic
; ─────────────────────────────────────────────────────────────

[globals]
; ── Synchrovox (sole upstream carrier) ───────────────────────
SYNCHROVOX_TRUNK=PJSIP/synchrovox-trunk
SYNCHROVOX_PREFIX=0
SYNCHROVOX_CLI=00919240292847

; ─────────────────────────────────────────────────────────────
;  from-kamailio: customer outbound calls
;  X-Customer-ID and X-Trunk-ID are in SIP headers from Kamailio
; ─────────────────────────────────────────────────────────────
[from-kamailio]

exten => _.,1,NoOp(Customer call: ${CALLERID(num)} → ${EXTEN})
 same => n,Set(CUSTOMER_ID=${PJSIP_HEADER(read,X-Customer-ID)})
 same => n,Set(TRUNK_ID=${PJSIP_HEADER(read,X-Trunk-ID)})
 same => n,NoOp(Customer: ${CUSTOMER_ID} Trunk: ${TRUNK_ID})

 ; Set CDR fields
 same => n,Set(CDR(accountcode)=${CUSTOMER_ID})
 same => n,Set(CDR(userfield)=${TRUNK_ID})
 same => n,Set(CHANNEL(accountcode)=${CUSTOMER_ID})

 ; Normalize destination to E.164
 ; 10 digits → +91XXXXXXXXXX (India)
 same => n,GotoIf($[${LEN(${EXTEN})} == 10]?normalize)
 ; 11 digits starting with 0 → strip 0, prepend +91
 same => n,GotoIf($[${LEN(${EXTEN})} == 11 & ${EXTEN:0:1} == 0]?normalize_0)
 same => n,Set(DEST=${EXTEN})
 same => n,Goto(route)

 same => n(normalize),Set(DEST=+91${EXTEN})
 same => n,Goto(route)

 same => n(normalize_0),Set(DEST=+91${EXTEN:1})
 same => n,Goto(route)

 same => n(route),Goto(outbound,${DEST},1)

; ─────────────────────────────────────────────────────────────
;  outbound: route all calls via Synchrovox
;
;  Synchrovox expects numeric DNIS prefixed by SYNCHROVOX_PREFIX (0)
;  e.g. 09142436879 — the + is stripped, +91 reduced to 10-digit,
;  then the prefix is prepended.
;
;  Primary CLI: SYNCHROVOX_CLI (00919240292847)
; ─────────────────────────────────────────────────────────────
[outbound]

; ── Indian numbers (+91XXXXXXXXXX) via Synchrovox ────────────
;  Format: prefix(0) + 10-digit → 09142436879
;  Strip +91 (first 3 chars) to get 10-digit number, then prepend prefix
exten => _+91.,1,NoOp(Outbound India via Synchrovox: ${EXTEN})
 same => n,Set(CALLERID(num)=${SYNCHROVOX_CLI})
 same => n,Set(TEN_DIGIT=${EXTEN:3})
 same => n,Set(DNIS=${SYNCHROVOX_PREFIX}${TEN_DIGIT})
 same => n,NoOp(Sending DNIS: ${DNIS} via ${SYNCHROVOX_TRUNK})
 same => n,Dial(PJSIP/${DNIS}@synchrovox-trunk,,tTo)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?congestion)
 same => n,Hangup(16)
 same => n(busy),Hangup(17)
 same => n(noanswer),Hangup(19)
 same => n(congestion),Hangup(34)

; ── International numbers (+XXXXXXXXXXX) via Synchrovox ──────
exten => _+.,1,NoOp(Outbound International via Synchrovox: ${EXTEN})
 same => n,Set(CALLERID(num)=${SYNCHROVOX_CLI})
 same => n,Set(DNIS=${SYNCHROVOX_PREFIX}${EXTEN:1})
 same => n,Dial(PJSIP/${DNIS}@synchrovox-trunk,,tTo)
 same => n,Hangup()

; ── Fallback ──────────────────────────────────────────────────
exten => i,1,Hangup(21)
exten => h,1,NoOp(Hangup: ${HANGUPCAUSE})

; ─────────────────────────────────────────────────────────────
;  from-synchrovox: inbound calls from Synchrovox
; ─────────────────────────────────────────────────────────────
[from-synchrovox]

exten => _.,1,NoOp(Inbound from Synchrovox: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(src_user)=${CALLERID(num)})
 same => n,Set(CDR(dst_user)=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@kamailio,,tTo)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────
;  from-ari: ARI-originated outbound calls
;  The ARI endpoint already dials Synchrovox — just keep alive
; ─────────────────────────────────────────────────────────────
[from-ari]
exten => _.,1,NoOp(ARI outbound call connected: ${EXTEN})
 same => n,Answer()
 same => n,Wait(120)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────
;  from-webrtc: Browser WebRTC phone calls
;  Dials number → normalize → outbound via Synchrovox
; ─────────────────────────────────────────────────────────────
[from-webrtc]

; ─── Local audio test extensions (do NOT touch Synchrovox) ───
; Dial these from the browser to verify the WebRTC media path
; in isolation. If 100 plays sound, WebRTC↔Asterisk audio works
; and any "no audio" on real calls is on the Synchrovox leg.

; 100  → play a welcome clip, then echo your voice back
exten => 100,1,NoOp(WebRTC media test — Playback + Echo)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 200  → music on hold (continuous audio for 60s)
exten => 200,1,NoOp(WebRTC media test — MusicOnHold)
 same => n,Answer()
 same => n,Wait(1)
 same => n,MusicOnHold(default,60)
 same => n,Hangup()

; 300  → echo only (speak, hear yourself)
exten => 300,1,NoOp(WebRTC media test — Echo only)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; ─── Real outbound calls ────────────────────────────────────

; 10-digit Indian number (e.g. 9142436879)
exten => _9XXXXXXXXX,1,NoOp(WebRTC call to: ${EXTEN})
 same => n,Set(DEST=+91${EXTEN})
 same => n,Goto(outbound,${DEST},1)

; 11-digit starting with 0 (e.g. 09142436879)
exten => _0XXXXXXXXXX,1,NoOp(WebRTC call to: ${EXTEN})
 same => n,Set(DEST=+91${EXTEN:1})
 same => n,Goto(outbound,${DEST},1)

; Already E.164 (+91XXXXXXXXXX)
exten => _+.,1,NoOp(WebRTC call E.164: ${EXTEN})
 same => n,Goto(outbound,${EXTEN},1)

exten => h,1,NoOp(WebRTC hangup: ${HANGUPCAUSE})
