[rtpengine]
# Listen for control commands from Kamailio
listen-ng=udp:0.0.0.0:22222

# Public IP (for SDP rewriting in NAT scenarios)
# MUST be the SIPaaS server's own public IP — never an upstream carrier IP.
interface=152.58.97.143

# RTP port range — kept disjoint from Asterisk's range (16000-16100)
# to prevent host-port collisions when Asterisk uses bridge networking.
port-min=10000
port-max=15000

# Logging
log-level=5
log-facility=daemon

# DTLS / SRTP
dtls-passive=on

# Timeout (seconds): remove stale sessions
timeout=60
silent-timeout=3600
final-timeout=10800

# Recording (optional — can be enabled per-call)
# recording-dir=/var/spool/rtpengine

# Stats
graphite=off
