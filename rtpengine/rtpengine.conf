[rtpengine]
# Listen for control commands from Kamailio
listen-ng=udp:0.0.0.0:22222

# Public IP (for SDP rewriting in NAT scenarios)
interface=1.2.3.4

# RTP port range (must match kamailio.cfg + docker-compose)
port-min=10000
port-max=20000

# Logging
log-level=5
log-facility=daemon

# DTLS / SRTP
dtls-passive=on

# Timeout (seconds): remove stale sessions
timeout=60
silent-timeout=3600
final-timeout=10800

# Recording (optional — can be enabled per-call)
# recording-dir=/var/spool/rtpengine

# Stats
graphite=off
