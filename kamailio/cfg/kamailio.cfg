##############################################################
#  SIP-as-a-Service — Kamailio Multi-Tenant SIP Proxy
#
#  Architecture:
#    Customer PBX/Phone
#      → Kamailio (this file) — auth, channel limit, balance check
#      → RTPEngine (media proxy)
#      → Asterisk (B2BUA, CDR, features)
#      → Upstream (TATA IP-based / Provider2 registration-based)
##############################################################

#!KAMAILIO

####### Preprocessor Defines ###############################

#!define WITH_MYSQL
#!define WITH_AUTH
#!define WITH_IPAUTH
#!define WITH_RTPENGINE
#!define WITH_TLS
#!define WITH_ANTIFLOOD
#!define WITH_MULTIDOMAIN

####### Global Parameters ##################################

debug=2
log_stderror=yes       # yes = logs go to stdout so docker compose logs works
log_facility=LOG_LOCAL0
fork=yes
children=8

/* SIP ports */
port=5060
#!ifdef WITH_TLS
tls_port_no=5061
#!endif

/* SIP domain */
alias="sip.yourdomain.com"

/* advertise public IP for SDP rewriting */
mhomed=1

####### Modules Section ####################################

mpath="/usr/lib/kamailio/modules/"

/* DB */
loadmodule "db_mysql.so"

/* Core */
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "xlog.so"
loadmodule "sqlops.so"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"

/* Auth */
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "permissions.so"

/* Dialog / Channel counting */
loadmodule "dialog.so"

/* Dispatcher (load balance to Asterisk) */
loadmodule "dispatcher.so"

/* Dynamic routing (to upstream providers) */
loadmodule "drouting.so"

/* UAC (register to upstream reg-based providers) */
loadmodule "uac.so"

/* RTPEngine */
loadmodule "rtpengine.so"

/* Anti-flood */
#!ifdef WITH_ANTIFLOOD
loadmodule "pike.so"
loadmodule "htable.so"
#!endif

/* CDR / accounting */
loadmodule "acc.so"

/* Redis (balance cache) */
loadmodule "ndb_redis.so"

/* Utils */
loadmodule "utils.so"

/* TLS */
#!ifdef WITH_TLS
loadmodule "tls.so"
#!endif

####### Module Parameters ##################################

/* ── Database ─────────────────────────────────────── */
modparam("db_mysql", "ping_interval", 60)

#!define DBURL "mysql://sipaas:StrongDBPassword123!@mysql/kamailio"

/* ── usrloc ───────────────────────────────────────── */
modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 2)
modparam("usrloc", "use_domain", 1)

/* ── registrar ────────────────────────────────────── */
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)
modparam("registrar", "default_expires", 120)

/* ── auth_db ──────────────────────────────────────── */
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "domain_column", "domain")
modparam("auth_db", "use_domain", 1)

/* ── permissions (IP auth for IP-based customer trunks) */
modparam("permissions", "db_url", DBURL)
modparam("permissions", "address_table", "address")

/* ── dialog (track concurrent calls per customer) ─── */
modparam("dialog", "db_url", DBURL)
modparam("dialog", "db_mode", 1)
modparam("dialog", "track_cseq_updates", 1)

/* ── dispatcher (Asterisk nodes) ─────────────────── */
modparam("dispatcher", "db_url", DBURL)
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "use_default", 0)
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;class=4;code=480;code=404")

/* ── drouting (upstream carrier routing) ─────────── */
modparam("drouting", "db_url", DBURL)
modparam("drouting", "use_domain", 1)

/* ── UAC (register to upstream reg-based trunks) ─── */
modparam("uac", "reg_db_url", DBURL)
modparam("uac", "reg_db_table", "uacreg")
modparam("uac", "reg_contact_addr", "127.0.0.1:5080")
modparam("uac", "reg_timer_interval", 60)
modparam("uac", "reg_retry_interval", 300)
modparam("uac", "restore_mode", "auto")

/* ── RTPEngine ────────────────────────────────────── */
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
modparam("rtpengine", "extra_id_pv", "$avp(extra_id)")

/* ── acc (CDR) ────────────────────────────────────── */
modparam("acc", "db_url", DBURL)
modparam("acc", "log_flag", 1)
modparam("acc", "log_missed_flag", 2)
modparam("acc", "log_extra", "src_user=$fU;src_domain=$fd;dst_user=$tU;dst_domain=$td;src_ip=$si")
modparam("acc", "db_flag", 1)
modparam("acc", "db_missed_flag", 2)
modparam("acc", "db_table_acc", "acc")
modparam("acc", "db_table_missed_calls", "missed_calls")
modparam("acc", "db_extra", "src_user=$fU;src_domain=$fd;dst_user=$tU;dst_domain=$td;src_ip=$si;customer_id=$avp(customer_id);trunk_id=$avp(trunk_id)")

/* ── sqlops connection alias "ca" (used by sql_query calls) */
modparam("sqlops", "sqlcon", "ca=>mysql://sipaas:StrongDBPassword123!@mysql/kamailio")

/* ── Redis (balance check) ────────────────────────── */
modparam("ndb_redis", "server", "name=redis;addr=127.0.0.1;port=6379;pass=RedisPass789!;db=0")

/* ── Pike (anti-flood) ────────────────────────────── */
#!ifdef WITH_ANTIFLOOD
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 4)
modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")
#!endif

/* ── TLS ──────────────────────────────────────────── */
#!ifdef WITH_TLS
modparam("tls", "config", "/etc/kamailio/tls/tls.cfg")
#!endif

/* ── rr ───────────────────────────────────────────── */
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

/* ── tm ───────────────────────────────────────────── */
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 120000)

/* ── jsonrpcs ─────────────────────────────────────── */
modparam("jsonrpcs", "fifo_name", "/var/run/kamailio/kamailio_rpc.fifo")
modparam("jsonrpcs", "transport", 7)

####### Routing Logic ######################################

request_route {

    /* ── Sanity checks ──────────────────────────── */
    if (!sanity_check()) {
        xlog("L_WARN", "Sanity check failed from $si:$sp\n");
        exit;
    }

    /* ── Anti-flood ─────────────────────────────── */
    #!ifdef WITH_ANTIFLOOD
    if ($sht(ipban=>$si)) {
        xlog("L_WARN", "Blocked banned IP: $si\n");
        exit;
    }
    if (!pike_check_req()) {
        xlog("L_WARN", "Pike ban on $si - adding to ipban\n");
        $sht(ipban=>$si) = 1;
        exit;
    }
    #!endif

    /* ── Max-Forwards ───────────────────────────── */
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    /* ── Record-Route for in-dialog requests ────── */
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    /* ── Handle in-dialog requests ──────────────── */
    if (has_totag()) {
        route(RELAY);
        exit;
    }

    /* ── Loose route ────────────────────────────── */
    if (loose_route()) {
        route(RELAY);
        exit;
    }

    /* ── Route by method ────────────────────────── */
    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("INVITE|REFER")) {
        route(AUTH);
        route(CALL);
        exit;
    }

    if (is_method("SUBSCRIBE|NOTIFY|OPTIONS|MESSAGE|INFO")) {
        route(RELAY);
        exit;
    }

    /* Drop everything else */
    sl_send_reply("405", "Method Not Allowed");
    exit;
}

/* ── SIP REGISTER handling ─────────────────────────────── */
route[REGISTRAR] {
    if (!is_method("REGISTER")) return;

    /* Check if this REGISTER comes from a known customer IP first */
    if (allow_source_address("1")) {
        /* IP-authenticated customer — skip digest auth for REGISTER */
        xlog("L_INFO", "REGISTER from IP-auth customer $si\n");
    } else {
        /* Digest auth for registration-based customers */
        if (!www_authorize("", "subscriber")) {
            www_challenge("", "0");
            exit;
        }
        if (!check_to()) {
            sl_send_reply("403", "Forbidden");
            exit;
        }
    }

    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

/* ── Authentication ─────────────────────────────────────── */
route[AUTH] {
    /* Allow in-dialog requests through without re-auth */
    if (has_totag()) return;

    /* Allow calls coming FROM Asterisk (127.0.0.1) */
    if ($si == "127.0.0.1") {
        xlog("L_INFO", "Pass-through from Asterisk\n");
        return;
    }

    /* Allow calls from whitelisted upstream providers (TATA etc.) */
    if (allow_source_address("2")) {
        xlog("L_INFO", "Inbound from upstream provider $si\n");
        setflag(10);    /* flag 10 = inbound from provider */
        return;
    }

    /* IP-authenticated customer trunk */
    if (allow_source_address("1")) {
        /* Load customer_id and trunk_id from address table */
        sql_query("ca", "SELECT customer_id, trunk_id, max_channels FROM address WHERE ip_addr='$si' AND grp=1 LIMIT 1", "rs");
        if ($dbr(rs=>rows) > 0) {
            $avp(customer_id) = $dbr(rs=>[0,0]);
            $avp(trunk_id)    = $dbr(rs=>[0,1]);
            $avp(max_channels)= $dbr(rs=>[0,2]);
        }
        xlog("L_INFO", "IP-auth customer $avp(customer_id) trunk $avp(trunk_id) from $si\n");
        route(BALANCE_CHECK);
        return;
    }

    /* Digest authentication for registration-based customer trunks */
    if (is_method("INVITE")) {
        if (!auth_check("", "subscriber", "1")) {
            auth_challenge("", "0");
            exit;
        }
        /* Load customer metadata after successful auth */
        sql_query("ca", "SELECT s.customer_id, s.trunk_id, s.max_channels FROM subscriber s WHERE s.username='$fU' AND s.domain='$fd' LIMIT 1", "rs");
        if ($dbr(rs=>rows) > 0) {
            $avp(customer_id) = $dbr(rs=>[0,0]);
            $avp(trunk_id)    = $dbr(rs=>[0,1]);
            $avp(max_channels)= $dbr(rs=>[0,2]);
        }
        consume_credentials();
        route(BALANCE_CHECK);
        return;
    }
}

/* ── Balance & Channel check ────────────────────────────── */
route[BALANCE_CHECK] {
    /* ── Channel limit check via dialog count ─────── */
    if ($avp(max_channels) != $null) {
        $var(active) = $dlg_ctx(active_calls);
        /* Per-customer active calls via Redis counter */
        redis_cmd("redis", "GET sipaas:channels:$avp(customer_id)", "reply");
        $var(current_channels) = $(redis_reply{s.int});
        if ($var(current_channels) >= $avp(max_channels)) {
            xlog("L_WARN", "Customer $avp(customer_id) channel limit reached ($var(current_channels)/$avp(max_channels))\n");
            sl_send_reply("503", "Channel Limit Reached");
            exit;
        }
    }

    /* ── Balance check via Redis ──────────────────── */
    redis_cmd("redis", "GET sipaas:balance:$avp(customer_id)", "reply");
    $var(balance) = $(redis_reply{s.float});
    if ($var(balance) <= 0) {
        xlog("L_WARN", "Customer $avp(customer_id) insufficient balance ($var(balance))\n");
        sl_send_reply("402", "Insufficient Balance");
        exit;
    }
}

/* ── Main call routing ──────────────────────────────────── */
route[CALL] {
    /* Enable CDR */
    setflag(1);

    /* Start dialog tracking (for channel counting) */
    dlg_manage();
    /* Store customer_id in dialog so event_route[dialog:end] can read it */
    dlg_setvar("customer_id", "$avp(customer_id)");
    dlg_setvar("trunk_id",    "$avp(trunk_id)");

    /* RTPEngine: offer */
    rtpengine_offer("replace-origin replace-session-connection trust-address");

    /* Set customer-specific X-headers for Asterisk */
    append_hf("X-Customer-ID: $avp(customer_id)\r\n");
    append_hf("X-Trunk-ID: $avp(trunk_id)\r\n");

    /* Route to Asterisk via dispatcher (group 1 = Asterisk nodes) */
    if (!ds_select_dst("1", "4")) {
        xlog("L_ERR", "No Asterisk nodes available\n");
        sl_send_reply("503", "No Media Server Available");
        exit;
    }

    /* Increment channel counter in Redis */
    redis_cmd("redis", "INCR sipaas:channels:$avp(customer_id)", "reply");
    redis_cmd("redis", "EXPIRE sipaas:channels:$avp(customer_id) 7200", "reply");

    xlog("L_INFO", "Routing call: $fU → $tU  customer=$avp(customer_id) dst=$du\n");

    t_on_failure("CALL_FAILURE");
    t_on_reply("CALL_REPLY");
    route(RELAY);
}

/* ── Handle replies for RTPEngine answer ────────────────── */
onreply_route[CALL_REPLY] {
    if (status =~ "18[036]") {
        rtpengine_manage("replace-origin replace-session-connection");
    }
    if (status == "200") {
        rtpengine_manage("replace-origin replace-session-connection");
    }
}

/* ── Failure route: failover to next Asterisk node ──────── */
failure_route[CALL_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
    if (t_check_status("486|600")) {
        exit;
    }
    if (!ds_next_dst()) {
        t_reply("503", "Service Unavailable");
    } else {
        t_relay();
    }
}

/* ── Inbound from provider → Asterisk ──────────────────── */
route[INBOUND_PROVIDER] {
    /* DID lookup: map called number to customer */
    sql_query("ca", "SELECT d.customer_id, d.trunk_id FROM did_numbers d WHERE d.number='$tU' AND d.status='active' LIMIT 1", "rs");
    if ($dbr(rs=>rows) == 0) {
        xlog("L_WARN", "DID $tU not found in inventory\n");
        sl_send_reply("404", "Number Not Found");
        exit;
    }
    $avp(customer_id) = $dbr(rs=>[0,0]);
    $avp(trunk_id)    = $dbr(rs=>[0,1]);

    append_hf("X-Customer-ID: $avp(customer_id)\r\n");
    append_hf("X-Trunk-ID: $avp(trunk_id)\r\n");
    append_hf("X-DID: $tU\r\n");

    rtpengine_offer("replace-origin replace-session-connection trust-address");

    if (!ds_select_dst("1", "4")) {
        sl_send_reply("503", "No Media Server Available");
        exit;
    }

    route(RELAY);
}

/* ── Generic relay ──────────────────────────────────────── */
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

/* ── Dialog callbacks: decrement channel counter on BYE ─── */
event_route[dialog:end] {
    redis_cmd("redis", "DECR sipaas:channels:$dlg_var(customer_id)", "reply");
    xlog("L_INFO", "Call ended — decremented channel counter for customer $dlg_var(customer_id)\n");
}

event_route[dialog:failed] {
    redis_cmd("redis", "DECR sipaas:channels:$dlg_var(customer_id)", "reply");
}
